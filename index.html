  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A browser teleprompter with automatic scrolling, mirror modes and a seven-language interface.">
  <meta name="theme-color" content="#050505">
  <title>Teleprompter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #f5f5f5;
      --muted: #a8a8a8;
      --panel: rgba(12, 12, 12, .94);
      --line: #343434;
      --accent: #2f8cff;
      --font-size: 72px;
      --side-margin: 16%;
      --script-font: Arial, "Noto Sans Hebrew", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
    }

    body {
      color: var(--fg);
      transition: background-color .15s ease, color .15s ease;
    }

    button, input, textarea { font: inherit; }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    .toolbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: safe center;
      gap: 12px;
      min-height: 76px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .28);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .tool-button {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #fff;
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
      transition: background .12s ease, border-color .12s ease, transform .12s ease;
    }

    .tool-button:hover { background: #252525; }
    .tool-button:active { transform: scale(.95); }
    .tool-button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    .tool-button[aria-pressed="true"] {
      border-color: var(--accent);
      background: rgba(47, 140, 255, .18);
      color: #82baff;
    }

    .play-button {
      background: var(--accent);
      font-size: 24px;
    }
    .play-button:hover { background: #4b9dff; }

    .control {
      display: grid;
      grid-template-columns: 126px;
      flex: 0 0 auto;
      gap: 4px;
      color: #fff;
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .control input[type="range"] {
      width: 126px;
      height: 20px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .control select {
      width: 126px;
      height: 32px;
      padding: 3px 8px;
      border: 1px solid #666;
      border-radius: 6px;
      background: #171717;
      color: #fff;
      cursor: pointer;
    }

    .color-control {
      grid-template-columns: auto;
      justify-items: center;
    }

    .color-control input {
      width: 58px;
      height: 34px;
      padding: 2px;
      border: 1px solid #777;
      border-radius: 5px;
      background: #171717;
      cursor: pointer;
    }

    .divider {
      width: 1px;
      height: 42px;
      margin: 0 2px;
      background: var(--line);
      flex: 0 0 auto;
    }

    .stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .scroll-area {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-color: #555 transparent;
      scrollbar-width: thin;
      scroll-behavior: auto;
    }

    .script {
      unicode-bidi: plaintext;
      width: auto;
      margin-inline: var(--side-margin);
      padding-block: 42vh 75vh;
      color: var(--fg);
      font-family: var(--script-font);
      font-size: var(--font-size);
      font-weight: 600;
      line-height: 1.42;
      text-align: start;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: normal;
      transform-origin: center center;
      will-change: transform;
    }

    .reading-line {
      position: absolute;
      z-index: 3;
      top: 45%;
      right: 7px;
      left: 7px;
      height: 2px;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(47,140,255,.5) 16%, rgba(47,140,255,.5) 84%, transparent);
      transition: opacity .2s ease;
    }
    .stage:hover .reading-line, .running .reading-line { opacity: .7; }

    .status {
      position: absolute;
      z-index: 5;
      bottom: 14px;
      left: 16px;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      background: rgba(0,0,0,.62);
      color: #d4d4d4;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .status.show { opacity: 1; transform: translateY(0); }

    .editor-backdrop {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, .76);
      backdrop-filter: blur(8px);
    }
    .editor-backdrop[hidden] { display: none; }

    .editor-panel {
      display: grid;
      grid-template-rows: auto minmax(260px, 1fr) auto;
      gap: 14px;
      width: min(920px, 100%);
      height: min(720px, 92vh);
      padding: 20px;
      border: 1px solid #404040;
      border-radius: 18px;
      background: #111;
      box-shadow: 0 24px 80px rgba(0,0,0,.65);
    }

    .editor-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .editor-title h1 { margin: 0; font-size: 22px; }
    .saved-note { color: #8bbcff; font-size: 13px; }

    #editor {
      width: 100%;
      min-height: 0;
      resize: none;
      padding: 18px;
      border: 1px solid #3c3c3c;
      border-radius: 12px;
      background: #050505;
      color: #fff;
      font-family: var(--script-font);
      unicode-bidi: plaintext;
      text-align: start;
      font-size: 24px;
      line-height: 1.55;
    }

    .editor-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .hint { color: var(--muted); font-size: 13px; }
    .primary {
      border: 0;
      border-radius: 10px;
      padding: 11px 24px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .mirror-x .script { transform: scaleX(-1); }
    .mirror-y .script { transform: scaleY(-1); }
    .mirror-x.mirror-y .script { transform: scale(-1); }

    @media (max-width: 900px) {
      .toolbar { justify-content: flex-start; min-height: 68px; padding-inline: 10px; }
      .control { grid-template-columns: 104px; }
      .control input[type="range"] { width: 104px; }
      .script { line-height: 1.36; }
    }

    @media (max-width: 560px) {
      .toolbar { gap: 6px; }
      .tool-button { width: 42px; height: 42px; }
      .divider { display: none; }
      .editor-actions { align-items: stretch; flex-direction: column; }
      .primary { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <nav class="toolbar" data-i18n-label="controls" aria-label="Teleprompter controls">
      <label class="control">
        <select id="language" data-i18n-label="language" aria-label="Interface language">
          <option value="en" lang="en">English</option>
          <option value="he" lang="he">עברית</option>
          <option value="ar" lang="ar">العربية</option>
          <option value="de" lang="de">Deutsch</option>
          <option value="es" lang="es">Español</option>
          <option value="fr" lang="fr">Français</option>
          <option value="ru" lang="ru">Русский</option>
        </select>
        <span data-i18n="language">Interface language</span>
      </label>
      <button class="tool-button play-button" id="play" type="button" data-i18n-label="play" aria-label="Play" data-i18n-title="playTitle" title="Play / pause (Space)">▶</button>
      <button class="tool-button" id="edit" type="button" data-i18n-label="edit" aria-label="Edit script" data-i18n-title="edit" title="Edit script">☰</button>
      <button class="tool-button" id="mirrorX" type="button" data-i18n-label="mirrorX" aria-label="Mirror horizontally" aria-pressed="false" data-i18n-title="mirrorX" title="Mirror horizontally">⇆</button>
      <button class="tool-button" id="mirrorY" type="button" data-i18n-label="mirrorY" aria-label="Mirror vertically" aria-pressed="false" data-i18n-title="mirrorY" title="Mirror vertically">⇅</button>
      <button class="tool-button" id="fullscreen" type="button" data-i18n-label="fullscreen" aria-label="Fullscreen" data-i18n-title="fullscreenTitle" title="Fullscreen (F)">⛶</button>

      <span class="divider" aria-hidden="true"></span>

      <label class="control color-control">
        <input id="bgColor" type="color" value="#050505" data-i18n-label="background" aria-label="Background color">
        <span data-i18n="background">Background color</span>
      </label>
      <label class="control color-control">
        <input id="textColor" type="color" value="#f5f5f5" data-i18n-label="textColor" aria-label="Text color">
        <span data-i18n="textColor">Text color</span>
      </label>
      <label class="control">
        <select id="fontFamily" data-i18n-label="font" aria-label="Font">
          <option value="document" data-i18n="documentFont">Document font</option>
          <option value="traditional">Traditional Arabic</option>
          <option value="typesetting">Arabic Typesetting</option>
          <option value="tahoma">Tahoma</option>
          <option value="arial">Arial</option>
          <option value="segoe">Segoe UI</option>
        </select>
        <span data-i18n="font">Font</span>
      </label>
      <label class="control">
        <input id="fontSize" data-i18n-label="size" aria-label="Size" type="range" min="28" max="140" step="1" value="72">
        <span id="fontSizeLabel">Size: 72px</span>
      </label>
      <label class="control">
        <input id="margin" data-i18n-label="margin" aria-label="Margins" type="range" min="2" max="38" step="1" value="16">
        <span id="marginLabel">Margins: 16%</span>
      </label>
      <label class="control">
        <input id="speed" data-i18n-label="speed" aria-label="Speed" type="range" min="1" max="100" step="1" value="30">
        <span id="speedLabel">Speed: 30</span>
      </label>

      <span class="divider" aria-hidden="true"></span>
      <button class="tool-button" id="rewind" type="button" data-i18n-label="rewind" aria-label="Back to start" data-i18n-title="rewindTitle" title="Back to start (Home)">↥</button>
    </nav>

    <section class="stage" id="stage" data-i18n-label="stage" aria-label="Teleprompter display">
      <div class="scroll-area" id="scrollArea" tabindex="0">
        <article class="script" id="script" dir="auto"></article>
      </div>
      <div class="reading-line" aria-hidden="true"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <section class="editor-backdrop" id="editorModal" role="dialog" aria-modal="true" aria-labelledby="editorTitle" hidden>
    <div class="editor-panel">
      <div class="editor-title">
        <h1 id="editorTitle" data-i18n="editorTitle">Edit script</h1>
        <span class="saved-note" data-i18n="autosave">Your script and font are saved automatically</span>
      </div>
      <textarea id="editor" dir="auto" spellcheck="true" data-i18n-label="script" aria-label="Teleprompter script"></textarea>
      <div class="editor-actions">
        <span class="hint" data-i18n="hint">Mix scripts in the same line. Ctrl / ⌘ + Enter to save.</span>
        <button class="primary" id="done" type="button" data-i18n="save">Save and display</button>
      </div>
    </div>
  </section>

          "rewound": "Retour au début",
          "fullscreenError": "Le plein écran n’est pas disponible dans ce navigateur.",
          "welcome": "Bienvenue dans le téléprompteur.\n\nOuvrez l’éditeur pour ajouter votre texte.\n\nAppuyez sur Espace pour lancer ou suspendre le défilement."
        },
        "ru": {
          "title": "Телесуфлёр",
          "language": "Язык интерфейса",
          "controls": "Управление телесуфлёром",
          "play": "Запустить",
          "pause": "Приостановить",
          "playTitle": "Запуск или пауза (Пробел)",
          "pauseTitle": "Пауза (Пробел)",
          "edit": "Редактировать текст",
          "mirrorX": "Отразить по горизонтали",
          "mirrorY": "Отразить по вертикали",
          "fullscreen": "Полноэкранный режим",
          "fullscreenTitle": "Полноэкранный режим (F)",
          "background": "Цвет фона",
          "textColor": "Цвет текста",
          "font": "Шрифт",
          "documentFont": "Шрифт документа",
          "size": "Размер",
          "margin": "Поля",
          "speed": "Скорость",
          "rewind": "К началу",
          "rewindTitle": "К началу (Home)",
          "stage": "Экран телесуфлёра",
          "script": "Текст телесуфлёра",
          "editorTitle": "Редактировать текст",
          "autosave": "Текст и шрифт сохраняются автоматически.",
          "hint": "На одной строке можно сочетать разные языки. Ctrl / ⌘ + Enter для сохранения.",
          "save": "Сохранить и показать",
          "end": "Конец текста",
          "empty": "Откройте редактор, чтобы добавить текст.",
          "saved": "Текст сохранён",
          "rewound": "Возврат к началу",
          "fullscreenError": "В этом браузере полноэкранный режим недоступен.",
          "welcome": "Добро пожаловать в телесуфлёр.\n\nОткройте редактор, чтобы добавить текст.\n\nНажмите пробел, чтобы запустить или приостановить прокрутку."
        }
      };

      const $ = (id) => document.getElementById(id);
      const elements = {
        language: $('language'), app: $('app'), stage: $('stage'), scroll: $('scrollArea'), script: $('script'),
        play: $('play'), edit: $('edit'), mirrorX: $('mirrorX'), mirrorY: $('mirrorY'),
        fullscreen: $('fullscreen'), rewind: $('rewind'), bgColor: $('bgColor'),
        textColor: $('textColor'), fontSize: $('fontSize'), margin: $('margin'), speed: $('speed'),
        fontFamily: $('fontFamily'),
        fontSizeLabel: $('fontSizeLabel'), marginLabel: $('marginLabel'), speedLabel: $('speedLabel'),
        modal: $('editorModal'), editor: $('editor'), done: $('done'), status: $('status')
      };

      const defaults = {
        language: (navigator.languages || [navigator.language])
          .map(locale => locale?.toLowerCase().split('-')[0])
          .find(locale => Object.hasOwn(messages, locale)) || 'en',
        text: null, bgColor: '#050505', textColor: '#f5f5f5',
        fontSize: 72, margin: 16, speed: 30, mirrorX: false, mirrorY: false,
        fontChoice: 'document', documentFont: ''
      };

      let state = loadState();
      let running = false;
      let frameId = 0;
      let previousTime = 0;
      let scrollRemainder = 0;
      let saveTimer = 0;
      let statusTimer = 0;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          const state = { ...defaults, ...saved };
          if (!Object.hasOwn(messages, state.language)) state.language = defaults.language;
          if (typeof state.text !== 'string') state.text = null;
          return state;
        } catch (_) {
          return { ...defaults };
        }
      }

      function persistState() {
        clearTimeout(saveTimer);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }

      function saveState() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(persistState, 120);
      }

      const t = (key) => messages[state.language][key];

      function renderScript() {
        elements.script.textContent = (state.text ?? t('welcome')) || t('empty');
      }

      function setPlayLabel() {
        elements.play.setAttribute('aria-label', t(running ? 'pause' : 'play'));
        elements.play.title = t(running ? 'pauseTitle' : 'playTitle');
      }

      function applyLanguage() {
        const root = document.documentElement;
        root.lang = state.language;
        document.title = t('title');
        root.dir = ['he', 'ar'].includes(state.language) ? 'rtl' : 'ltr';
        elements.language.value = state.language;
        for (const node of document.querySelectorAll('[data-i18n]')) {
          node.textContent = t(node.dataset.i18n);
        }
        for (const node of document.querySelectorAll('[data-i18n-label]')) {
          node.setAttribute('aria-label', t(node.dataset.i18nLabel));
        }
        for (const node of document.querySelectorAll('[data-i18n-title]')) {
          node.title = t(node.dataset.i18nTitle);
        }
        setPlayLabel();
        updateLabels();
        renderScript();
        elements.status.classList.remove('show');
      }

      function applyState() {
        renderScript();
        elements.bgColor.value = state.bgColor;
        elements.textColor.value = state.textColor;
        elements.fontFamily.value = state.fontChoice;
        elements.fontSize.value = state.fontSize;
        elements.margin.value = state.margin;
        elements.speed.value = state.speed;
        document.documentElement.style.setProperty('--bg', state.bgColor);
        document.documentElement.style.setProperty('--fg', state.textColor);
        document.documentElement.style.setProperty('--font-size', `${state.fontSize}px`);
        document.documentElement.style.setProperty('--side-margin', `${state.margin}%`);
        applyScriptFont();
        elements.stage.classList.toggle('mirror-x', state.mirrorX);
        elements.stage.classList.toggle('mirror-y', state.mirrorY);
        elements.mirrorX.setAttribute('aria-pressed', String(state.mirrorX));
        elements.mirrorY.setAttribute('aria-pressed', String(state.mirrorY));
        updateLabels();
      }

      function sanitizeFontFamily(value) {
        if (typeof value !== 'string') return '';
        const clean = value.trim();
        if (!clean || clean.length > 140 || /[;(){}<>]/.test(clean)) return '';
        return clean;
      }

      function applyScriptFont() {
        const stacks = {
          traditional: '"Traditional Arabic", "Arabic Typesetting", Tahoma, Arial, sans-serif',
          typesetting: '"Arabic Typesetting", "Traditional Arabic", Tahoma, Arial, sans-serif',
          tahoma: 'Tahoma, Arial, sans-serif',
          arial: 'Arial, Tahoma, sans-serif',
          segoe: '"Segoe UI", Tahoma, Arial, sans-serif'
        };
        const detected = sanitizeFontFamily(state.documentFont);
        const stack = state.fontChoice === 'document' && detected
          ? `${detected}, Tahoma, Arial, sans-serif`
          : state.fontChoice === 'document'
            ? stacks.traditional
            : (stacks[state.fontChoice] || stacks.arial);
        document.documentElement.style.setProperty('--script-font', stack);
      }

      function fontFromWordHtml(html) {
        if (!html) return '';
        try {
          // Template contents stay inert while we inspect the pasted font.
          const template = document.createElement('template');
          template.innerHTML = html;
          const styledNodes = template.content.querySelectorAll('[style]');
          for (const node of styledNodes) {
            const candidate = sanitizeFontFamily(node.style.fontFamily);
            if (candidate) return candidate;
          }
        } catch (_) {}
        return '';
      }

      function cleanWordText(text) {
        return text
          .normalize('NFC')
          .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, '')
          .replace(/\r\n?/g, '\n');
      }

      function updateLabels() {
        elements.fontSizeLabel.textContent = `${t('size')}: ${state.fontSize}px`;
        elements.marginLabel.textContent = `${t('margin')}: ${state.margin}%`;
        elements.speedLabel.textContent = `${t('speed')}: ${state.speed}`;
      }

      function showStatus(message) {
        clearTimeout(statusTimer);
        elements.status.textContent = message;
        elements.status.classList.add('show');
        statusTimer = setTimeout(() => elements.status.classList.remove('show'), 1100);
      }

      function pixelsPerSecond() {
        return 8 + Math.pow(Number(state.speed) / 100, 1.45) * 250;
      }

      function tick(time) {
        if (!running) return;
        if (!previousTime) previousTime = time;
        const delta = Math.min(time - previousTime, 40);
        previousTime = time;
        const direction = state.mirrorY ? -1 : 1;
        // Keep subpixel movement across frames so low speeds still advance.
        const distance = scrollRemainder + pixelsPerSecond() * delta / 1000;
        const pixels = Math.floor(distance);
        scrollRemainder = distance - pixels;
        if (pixels) elements.scroll.scrollTop += direction * pixels;

        const reachedEnd = direction > 0
          ? elements.scroll.scrollTop + elements.scroll.clientHeight >= elements.scroll.scrollHeight - 2
          : elements.scroll.scrollTop <= 0;
        if (reachedEnd) {
          setRunning(false);
          showStatus(t('end'));
          return;
        }
        frameId = requestAnimationFrame(tick);
      }

      function setRunning(value) {
        running = Boolean(value);
        elements.app.classList.toggle('running', running);
        elements.play.textContent = running ? '❚❚' : '▶';
        setPlayLabel();
        cancelAnimationFrame(frameId);
        previousTime = 0;
        scrollRemainder = 0;
        if (running) frameId = requestAnimationFrame(tick);
      }

      function toggleRunning() { setRunning(!running); }

      function openEditor() {
        setRunning(false);
        elements.modal.hidden = false;
        elements.editor.value = state.text ?? t('welcome');
        requestAnimationFrame(() => {
          elements.editor.focus();
          elements.editor.setSelectionRange(elements.editor.value.length, elements.editor.value.length);
        });
      }

      function closeEditor() {
        state.text = elements.editor.value;
        renderScript();
        elements.modal.hidden = true;
        persistState();
        showStatus(t('saved'));
        elements.scroll.focus({ preventScroll: true });
      }

      function setOption(key, value) {
        state[key] = value;
        applyState();
        saveState();
      }

      elements.language.addEventListener('change', (event) => {
        const language = event.target.value;
        if (!Object.hasOwn(messages, language)) return;
        state.language = language;
        applyLanguage();
        persistState();
      });

      elements.play.addEventListener('click', toggleRunning);
      elements.edit.addEventListener('click', openEditor);
      elements.done.addEventListener('click', closeEditor);
      elements.rewind.addEventListener('click', () => {
        setRunning(false);
        elements.scroll.scrollTop = state.mirrorY ? elements.scroll.scrollHeight : 0;
        showStatus(t('rewound'));
      });

      elements.mirrorX.addEventListener('click', () => setOption('mirrorX', !state.mirrorX));
      elements.mirrorY.addEventListener('click', () => {
        setRunning(false);
        setOption('mirrorY', !state.mirrorY);
        elements.scroll.scrollTop = state.mirrorY ? elements.scroll.scrollHeight : 0;
      });

      elements.fullscreen.addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch (_) { showStatus(t('fullscreenError')); }
      });

      document.addEventListener('fullscreenchange', () => {
        elements.fullscreen.setAttribute('aria-pressed', String(Boolean(document.fullscreenElement)));
      });

      elements.bgColor.addEventListener('input', (e) => setOption('bgColor', e.target.value));
      elements.textColor.addEventListener('input', (e) => setOption('textColor', e.target.value));
      elements.fontFamily.addEventListener('change', (e) => setOption('fontChoice', e.target.value));
      elements.fontSize.addEventListener('input', (e) => setOption('fontSize', Number(e.target.value)));
      elements.margin.addEventListener('input', (e) => setOption('margin', Number(e.target.value)));
      elements.speed.addEventListener('input', (e) => setOption('speed', Number(e.target.value)));

      elements.editor.addEventListener('input', () => {
        state.text = elements.editor.value;
        saveState();
      });

      elements.editor.addEventListener('paste', (e) => {
        const clipboard = e.clipboardData;
        if (!clipboard) return;

        const detectedFont = fontFromWordHtml(clipboard.getData('text/html'));
        if (detectedFont) {
          state.documentFont = detectedFont;
          state.fontChoice = 'document';
          elements.fontFamily.value = 'document';
          applyScriptFont();
        }

        const plainText = clipboard.getData('text/plain');
        if (!plainText) return;
        e.preventDefault();
        const cleanedText = cleanWordText(plainText);
        elements.editor.setRangeText(
          cleanedText,
          elements.editor.selectionStart,
          elements.editor.selectionEnd,
          'end'
        );
        elements.editor.dispatchEvent(new Event('input', { bubbles: true }));
      });

      elements.modal.addEventListener('click', (e) => {
        if (e.target === elements.modal) closeEditor();
      });

      document.addEventListener('keydown', (e) => {
        const editing = !elements.modal.hidden;
        if (editing) {
          if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); closeEditor(); }
          return;
        }
        const active = document.activeElement?.tagName;
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(active)) return;
        if (e.code === 'Space' && active === 'BUTTON') return;

        if (e.code === 'Space') { e.preventDefault(); toggleRunning(); }
        else if (e.key.toLowerCase() === 'f') { e.preventDefault(); elements.fullscreen.click(); }
        else if (e.key === 'Home') { e.preventDefault(); elements.rewind.click(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); elements.scroll.scrollTop += 70; }
        else if (e.key === 'ArrowUp') { e.preventDefault(); elements.scroll.scrollTop -= 70; }
        else if (e.key === '+' || e.key === '=') {
          e.preventDefault(); setOption('fontSize', Math.min(140, state.fontSize + 2));
        } else if (e.key === '-' || e.key === '_') {
          e.preventDefault(); setOption('fontSize', Math.max(28, state.fontSize - 2));
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) setRunning(false);
      });

      applyLanguage();
      applyState();
      elements.scroll.focus({ preventScroll: true });
    })();
  </script>
</body>
</html>
